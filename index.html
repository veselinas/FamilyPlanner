<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Family Planner">
<meta name="theme-color" content="#0d1117">
<title>Family Planner</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #0d1117;
  --bg2:   #161b22;
  --bg3:   #21262d;
  --bg4:   #2d333b;
  --border:#30363d;
  --border2:#3d444d;
  --text:  #e6edf3;
  --text2: #8b949e;
  --text3: #6e7681;
  --accent:#58a6ff;
  --accent2:#1f6feb;
  --green: #3fb950;
  --yellow:#d29922;
  --red:   #f85149;
  --purple:#bc8cff;
  --orange:#ffa657;
  --family:#58a6ff;
  --user:  #3fb950;
  --r:8px; --r2:12px;
  --mono:'DM Mono',monospace;
  --display:'Syne',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--display);overflow:hidden}
body{display:flex;flex-direction:column;height:100dvh}

/* ── HEADER */
#header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;z-index:50}
#user-area{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
select,input{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:var(--r);font-family:var(--display);outline:none}
select:focus,input:focus{border-color:var(--accent)}
#user-select{padding:5px 8px;font-size:13px;max-width:140px;cursor:pointer}
#btn-add-user{background:var(--bg3);border:1px solid var(--border);color:var(--accent);width:30px;height:30px;border-radius:var(--r);cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .15s}
#btn-add-user:hover{background:var(--bg4)}
.od-status{display:flex;align-items:center;gap:4px;flex-shrink:0}
.od-dot{width:7px;height:7px;border-radius:50%;background:var(--text3)}
.od-dot.ok{background:var(--green)}.od-dot.err{background:var(--red)}
.od-label{font-size:10px;color:var(--text3);font-family:var(--mono);white-space:nowrap}
#week-info{text-align:center;flex:1;flex-shrink:0}
#week-num-lbl{font-size:12px;font-family:var(--mono);color:var(--text2)}
#date-range-lbl{font-size:10px;font-family:var(--mono);color:var(--text3)}
#btn-save{background:var(--accent2);border:none;color:#fff;padding:6px 16px;border-radius:var(--r);font-family:var(--display);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,transform .1s;flex-shrink:0}
#btn-save:hover{background:var(--accent)}
#btn-save:active{transform:scale(.96)}
#btn-save.saved{background:var(--green)}

/* ── MAIN */
#main{display:flex;flex:1;overflow:hidden}

/* ── TASKS PANEL */
#tasks-panel{width:40%;min-width:200px;display:flex;flex-direction:column;border-right:1px solid var(--border);overflow:hidden}
@media(min-width:768px){#tasks-panel{width:37%}}
#tasks-hdr{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0;flex-wrap:wrap}
#tasks-hdr h2{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);flex-shrink:0}
#goal-filter{padding:4px 6px;font-size:11px;max-width:110px;cursor:pointer}
#btn-add-task{background:var(--bg3);border:1px solid var(--accent2);color:var(--accent);padding:4px 9px;border-radius:var(--r);font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s;margin-left:auto}
#btn-add-task:hover{background:var(--bg4)}
#tasks-list{flex:1;overflow-y:auto;padding:6px}
#tasks-list::-webkit-scrollbar{width:3px}
#tasks-list::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* category/subcat */
.cat-block{margin-bottom:6px}
.cat-hdr{display:flex;align-items:center;gap:5px;padding:4px 7px;cursor:pointer;border-radius:var(--r);font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);background:var(--bg3);border:1px solid var(--border);user-select:none}
.cat-hdr:hover{background:var(--bg4)}
.arr{font-size:9px;transition:transform .18s}
.collapsed .arr{transform:rotate(-90deg)}
.subcat-block{margin:3px 0 0 4px}
.sub-hdr{display:flex;align-items:center;gap:4px;padding:3px 8px;cursor:pointer;font-size:10px;font-weight:600;color:var(--text3);user-select:none}
.sub-hdr:hover{color:var(--text2)}
.task-cols{display:flex;flex-direction:column;gap:3px;padding:2px 6px 4px}


/* task card */
.tcard{background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:4px 6px;cursor:grab;transition:border-color .12s,box-shadow .12s;user-select:none}
.tcard:hover{border-color:var(--border2);box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tcard.dragging{opacity:.4;cursor:grabbing}
.tcard.fam{border-left:2px solid var(--family)}
.tcard.usr{border-left:2px solid var(--user)}
.tcard-top{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px}
.prio-badge{font-size:8px;font-weight:700;font-family:var(--mono);padding:1px 3px;border-radius:3px;flex-shrink:0}
.pP-H{background:rgba(248,81,73,.18);color:var(--red)}
.pP-M{background:rgba(210,153,34,.18);color:var(--yellow)}
.pP-L{background:rgba(63,185,80,.14);color:var(--green)}
.tname{font-size:11px;font-weight:500}
.tdur{font-size:9px;color:var(--text3);font-family:var(--mono)}
.tmeta{font-size:9px;color:var(--text3);font-family:var(--mono);margin-top:2px;display:flex;gap:5px;flex-wrap:wrap}
.tdl{color:var(--orange)}.tfreq{color:var(--purple)}
.tlc{color:var(--green)}
  
/* no-user */
.no-user{padding:16px;text-align:center;color:var(--text3);font-size:12px}

/* ── WEEK PANEL */
#week-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
#week-nav{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
#week-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:28px;height:28px;border-radius:var(--r);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .12s}
#week-nav button:hover{background:var(--bg4)}
#day-lbl{font-size:12px;font-family:var(--mono);color:var(--text2);font-weight:600}

/* week grid */
#week-grid{flex:1;display:flex;flex-direction:column;overflow:hidden}
#day-hdrs-row{display:flex;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.t-gutter{width:42px;flex-shrink:0}
.dhdr{flex:1;text-align:center;padding:4px 2px;font-size:10px;font-family:var(--mono);color:var(--text3);border-left:1px solid var(--border)}
.dhdr.today{color:var(--accent);font-weight:700;background:rgba(88,166,255,.06)}

/* unscheduled tray */
#unsched-row{display:flex;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;max-height:160px;overflow-y:auto}
.unsched-gutter{width:42px;flex-shrink:0;font-size:9px;color:var(--text3);font-family:var(--mono);padding:5px 5px 0;text-align:right}
.unsched-col{flex:1;border-left:1px solid var(--border);min-height:38px;padding:3px;display:flex;flex-direction:column;gap:3px;position:relative}
.unsched-col.dov{background:rgba(88,166,255,.07)}
  
/* hourly time grid */
#week-body{flex:1;overflow-y:scroll;overflow-x:hidden}
#week-body::-webkit-scrollbar{width:4px}
#week-body::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
#tgrid{display:flex}
#t-labels{width:42px;flex-shrink:0}
.tlabel{height:var(--hr-h);display:flex;align-items:flex-start;padding-top:6px;padding-right:5px;font-size:8px;font-family:var(--mono);color:var(--text3);justify-content:flex-end;flex-shrink:0;min-height:var(--hr-h)}
#dcols-wrap{flex:1;display:flex}
.dcol{flex:1;border-left:1px solid var(--border);display:flex;flex-direction:column}
.dcol.today-col{background:rgba(88,166,255,.02)}

/* hourly row */
.hour-row{border-top:1px solid var(--border);display:flex;flex-direction:column;gap:2px;padding:2px 3px;position:relative;flex-shrink:0}
.hour-row:first-child{border-top:none}
.hour-row.dov{background:rgba(88,166,255,.07)}
.hour-row.now-hour{border-top:2px solid var(--red)}
@media(max-width:767px){.hour-row{min-height:var(--hr-h)}}
@media(min-width:768px){.hour-row{height:var(--hr-h);overflow:hidden}}
/* overflow badge */
.hr-more{position:absolute;bottom:2px;right:3px;font-size:9px;font-weight:700;
  font-family:var(--mono);color:var(--text3);background:var(--bg3);
  border:1px solid var(--border2);border-radius:3px;padding:0 3px;
  line-height:14px;pointer-events:none;z-index:4}
/* tooltip */
.hr-tooltip{
  display:none;position:absolute;top:0;left:calc(100% + 6px);
  z-index:500;background:var(--bg2);border:1px solid var(--border2);
  border-radius:var(--r);padding:7px 10px;min-width:200px;max-width:280px;
  box-shadow:0 8px 28px rgba(0,0,0,.55);pointer-events:none}
.hour-row:hover .hr-tooltip{display:block}
.hr-tooltip.flip{left:auto;right:calc(100% + 6px)}
.htt-row{padding:4px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:2px}
.htt-row:last-child{border-bottom:none;padding-bottom:0}
.htt-meta{font-size:9px;font-family:var(--mono)}
.htt-name{font-size:11px;font-weight:600;word-break:break-word;white-space:normal;line-height:1.3}
.htt-cat{font-size:9px;color:var(--text3);opacity:.7}

/* phone: rows grow with content */
@media(max-width:767px){
  .hour-row{min-height:var(--hr-h)}
}
/* desktop: rows fixed height, overflow hidden */
@media(min-width:768px){
  .hour-row{height:var(--hr-h);overflow:hidden}
}

/* overflow indicator */
.hr-overflow{position:absolute;bottom:2px;right:3px;font-size:9px;color:var(--text3);line-height:1;pointer-events:none;z-index:3}

/* tooltip */
.hr-tooltip{
  display:none;
  position:absolute;
  top:0;left:100%;
  margin-left:6px;
  z-index:200;
  background:var(--bg2);
  border:1px solid var(--border2);
  border-radius:var(--r);
  padding:7px 10px;
  min-width:200px;
  max-width:280px;
  box-shadow:0 8px 24px rgba(0,0,0,.5);
  pointer-events:none;
}
.hour-row:hover .hr-tooltip{display:block}
/* flip to left if near right edge — handled by JS class */
.hr-tooltip.flip-left{left:auto;right:100%;margin-left:0;margin-right:6px}
.hr-tooltip-row{font-size:11px;padding:3px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:1px}
.hr-tooltip-row:last-child{border-bottom:none}
.hr-tooltip-meta{font-size:9px;font-family:var(--mono);opacity:.8}
.hr-tooltip-name{font-size:11px;font-weight:600;word-break:break-word;white-space:normal}
.hr-tooltip-cat{font-size:9px;color:var(--text3);opacity:.7}

/* week task chip */
.wblock{border-radius:5px;padding:3px 6px 3px 6px;cursor:pointer;border:1px solid transparent;transition:filter .12s;user-select:none;font-family:var(--display);display:flex;flex-direction:column;position:relative;gap:1px}
.wblock.fam{background:rgba(88,166,255,.18);border-color:rgba(88,166,255,.4)}
.wblock.usr{background:rgba(63,185,80,.18);border-color:rgba(63,185,80,.4)}
.wblock:hover{filter:brightness(1.2)}
.wblock.dragging-w{opacity:.35}
.wblock-row1{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.wblock-meta{font-size:9px;font-family:var(--mono);opacity:.8;white-space:nowrap}
.wblock-status{font-size:10px;flex-shrink:0}
.wblock-row2{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.wblock-name{font-size:11px;font-weight:600;word-break:break-word;white-space:normal;line-height:1.3}
.wblock-cat{font-size:9px;color:var(--text3);opacity:.7;white-space:normal;word-break:break-word}
.wblock .wx{position:absolute;top:2px;right:3px;width:13px;height:13px;display:none;align-items:center;justify-content:center;font-size:10px;line-height:1;cursor:pointer;border-radius:3px;opacity:.7}
.wblock:hover .wx{display:flex}
.wblock .wx:hover{opacity:1;background:rgba(255,255,255,.15)}
.tchip .cx{display:none;margin-left:3px;font-size:11px;cursor:pointer;opacity:.6}
.tchip:hover .cx{display:inline}
.tchip .cx:hover{opacity:1}

/* now line */
.nowline{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:5;pointer-events:none}
.nowdot{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* ── PRINT BAR */
#print-bar{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
#print-bar label{font-size:11px;color:var(--text3)}
#print-bar input{padding:4px 7px;font-size:11px;width:66px;font-family:var(--mono)}
#btn-print{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 12px;border-radius:var(--r);font-size:11px;font-weight:600;cursor:pointer;transition:background .12s}
#btn-print:hover{background:var(--bg4)}

/* ── MODAL */
.movl{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;z-index:999;backdrop-filter:blur(4px);padding:14px}
.mdl{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r2);padding:20px;width:100%;max-width:460px;max-height:90dvh;overflow-y:auto;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.mdl h3{font-size:14px;font-weight:700;margin-bottom:14px}
.fr{display:flex;flex-direction:column;gap:3px;margin-bottom:10px}
.fr label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text3)}
.fr input,.fr select,.fr textarea{padding:6px 9px;font-size:12px;border-radius:var(--r);width:100%}
.macts{display:flex;justify-content:flex-end;gap:7px;margin-top:14px}
.btn-c{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:6px 14px;border-radius:var(--r);font-family:var(--display);font-size:12px;cursor:pointer}
.btn-ok{background:var(--accent2);border:none;color:#fff;padding:6px 16px;border-radius:var(--r);font-family:var(--display);font-size:12px;font-weight:700;cursor:pointer}
.btn-ok:hover{background:var(--accent)}

/* goal tag picker */
.goal-picker{border:1px solid var(--border);border-radius:var(--r);background:var(--bg3);padding:5px 7px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;cursor:text;min-height:36px}
.goal-picker:focus-within{border-color:var(--accent)}
.goal-tag{display:inline-flex;align-items:center;gap:4px;background:rgba(88,166,255,.15);border:1px solid rgba(88,166,255,.35);color:var(--accent);border-radius:4px;padding:2px 7px;font-size:11px;font-weight:600;white-space:nowrap}
.goal-tag .rm{cursor:pointer;font-size:13px;line-height:1;color:var(--text3);margin-left:1px}
.goal-tag .rm:hover{color:var(--red)}
.goal-picker input{background:transparent;border:none;outline:none;color:var(--text);font-family:var(--display);font-size:12px;min-width:80px;flex:1}
.goal-suggestions{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r);margin-top:3px;overflow:hidden;display:none;flex-direction:column;max-height:140px;overflow-y:auto}
.goal-suggestions.open{display:flex}
.goal-sugg-item{padding:6px 10px;font-size:12px;cursor:pointer;color:var(--text2);transition:background .1s}
.goal-sugg-item:hover,.goal-sugg-item.active{background:var(--bg4);color:var(--text)}
.goal-sugg-item.new-goal{color:var(--accent);font-style:italic}

/* ── TOAST */
#toast{position:fixed;bottom:58px;left:50%;transform:translateX(-50%);background:var(--bg3);border:1px solid var(--border2);color:var(--text);padding:7px 16px;border-radius:var(--r);font-size:12px;z-index:2000;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
#msal-btn{display:none;position:fixed;bottom:66px;right:14px;background:var(--accent2);border:none;color:#fff;padding:7px 13px;border-radius:var(--r);cursor:pointer;font-family:var(--display);font-size:12px;font-weight:700;z-index:500}
#msal-btn.v{display:block}
</style>
</head>
<body>

<div id="header">
  <div id="user-area">
    <select id="user-select"><option value="">— User —</option></select>
    <button id="btn-add-user" title="Add user">+</button>
    <div class="od-status">
      <div class="od-dot" id="od-dot"></div>
      <span class="od-label" id="od-lbl">OneDrive</span>
    </div>
  </div>
  <div id="week-info">
    <div id="week-num-lbl">Week —</div>
    <div id="date-range-lbl">—</div>
  </div>
  <button id="btn-save">Save</button>
</div>

<div id="main">
  <!-- TASKS -->
  <div id="tasks-panel">
    <div id="tasks-hdr">
      <h2>Tasks</h2>
      <select id="goal-filter"><option value="">All goals</option></select>
      <button id="btn-add-task">+ Task</button>
    </div>
    <div id="tasks-list"></div>
  </div>

  <!-- WEEK -->
  <div id="week-panel">
    <div id="week-nav">
      <button id="btn-prev">&#8592;</button>
      <span id="day-lbl"></span>
      <button id="btn-next">&#8594;</button>
    </div>
    <div id="week-grid">
      <div id="day-hdrs-row"><div class="t-gutter"></div></div>
      <div id="unsched-row"><div class="unsched-gutter">∅</div></div>
      <div id="week-body">
        <div id="tgrid">
          <div id="t-labels"></div>
          <div id="dcols-wrap"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="print-bar">
  <label>Export CSV:</label>
  <input id="p-week" type="number" min="1" max="53" placeholder="Wk">
  <input id="p-year" type="number" min="2020" max="2099" placeholder="Year">
  <button id="btn-print">⬇ CSV</button>
  <div style="width:1px;background:var(--border);align-self:stretch;margin:0 4px"></div>
  <label>Print day:</label>
  <input id="p-date" type="date">
  <button id="btn-print-day">🖨 Print Day</button>
</div>

<div id="toast"></div>
<button id="msal-btn">Sign in to OneDrive</button>

<script>
/* ═══════════════════════════════════════════
   GLOBAL CONFIG — change CLIENT_ID below
   ═══════════════════════════════════════════ */
window.AZURE_CLIENT_ID = "e800f792-bd36-483f-a74c-772787891ecd";

/* ═══════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════ */
const S = {
  user: null,
  users: [],
  tasks: [],         // family tasks
  uTasks: {},        // username -> []
  goals: [],
  plans: {},         // username -> []
  dirty: false,
  token: null,
  odOk: false,
  phone: innerWidth < 768,
  dayOff: 0,         // phone: 0-6 (Mon=0)
};

const FOLDER = "App_FamilyPlanner";
const TASK_HDRS = ['id','category','subcategory','task','duration','priority','scheduled','deadline','frequency','valid','last_completed'];
const PLAN_HDRS = ['week_num','year','date','task_id','task','start_time','end_time','completed'];
const GOAL_HDRS = ['id','username','goal','task_id'];
const USER_HDRS = ['username'];

/* date helpers */
const p2 = n => String(n).padStart(2,'0');
function isoWeek(d) {
  const u = new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));
  return Math.ceil((((u - new Date(Date.UTC(u.getUTCFullYear(),0,1)))/86400000)+1)/7);
}
function monday(w,y) {
  const j4 = new Date(y,0,4);
  const dow = j4.getDay()||7;
  const m = new Date(j4);
  m.setDate(j4.getDate()-dow+1+(w-1)*7);
  return m;
}
function fmtDate(d){ return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) }
function t2m(t){ if(!t)return 0; const[h,m]=t.split(':').map(Number); return h*60+(m||0) }
function m2t(m){ return `${p2(Math.floor(m/60))}:${p2(m%60)}` }
function dateStr(d){ return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}` }
function isToday(d){ const n=new Date(); return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate() }

const NOW = new Date();
let dispWeek = isoWeek(NOW);
let dispYear = NOW.getFullYear();
S.dayOff = (NOW.getDay()+6)%7;

/* ═══════════════════════════════════════════
   CSV
   ═══════════════════════════════════════════ */
function parseCSV(txt){
  const lines=txt.trim().split('\n');
  if(lines.length<2)return[];
  const hdrs=lines[0].split(',').map(s=>s.trim());
  return lines.slice(1).filter(l=>l.trim()).map(l=>{
    const v=l.split(',').map(s=>s.trim());
    const o={};
    hdrs.forEach((h,i)=>o[h]=v[i]??'');
    return o;
  });
}
function toCSV(rows,hdrs){
  return [hdrs.join(','),...rows.map(r=>hdrs.map(h=>(r[h]??'').replace(/,/g,'；')).join(','))].join('\n');
}

let msalApp = null;
const SCOPES = ['Files.ReadWrite'];

async function initMSAL(){
  if(!window.AZURE_CLIENT_ID||window.AZURE_CLIENT_ID==="YOUR_AZURE_CLIENT_ID_HERE"){
    setOD(false,'No Client ID'); showSignInBtn(); return;
  }
  try{
    await loadScript("https://unpkg.com/@azure/msal-browser@v5.x/lib/msal-browser.min.js");
    if(!window.msal){setOD(false,'MSAL fail'); showSignInBtn(); return;}
    msalApp = new msal.PublicClientApplication({
      auth:{clientId:window.AZURE_CLIENT_ID, authority: 'https://login.microsoftonline.com/common', redirectUri:"https://veselinas.github.io/FamilyPlanner/", navigateToLoginRequestUrl: false},
      cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
    });
    await msalApp.initialize();

    // Handle redirect response first (in case we're returning from a redirect flow)
    const redirectResult = await msalApp.handleRedirectPromise().catch(()=>null);
    if(redirectResult && redirectResult.accessToken){
      S.token=redirectResult.accessToken; S.odOk=true;
      setOD(true,'OK'); hideSignInBtn();
      await loadAll(); return;
    }

    // Try silent acquisition with any cached account
    const accs = msalApp.getAllAccounts();
    if(accs.length){
      try{
        const res = await msalApp.acquireTokenSilent({scopes:SCOPES, account:accs[0]});
        S.token=res.accessToken; S.odOk=true;
        setOD(true,'OK'); hideSignInBtn();
        await loadAll(); return;
      }catch(e){/* silent failed — fall through to show sign-in button */}
    }

    // No cached session — show sign-in button so user can authenticate
    setOD(false,'Sign in needed');
    showSignInBtn();
  }catch(e){setOD(false,'Error: '+e.message); showSignInBtn();}
}

function loadScript(src){return new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=r;s.onerror=r;document.head.appendChild(s)})}

function showSignInBtn(){ document.getElementById('msal-btn').classList.add('v'); }
function hideSignInBtn(){ document.getElementById('msal-btn').classList.remove('v'); }

async function getToken(interact=false){
  if(!msalApp)return;
  try{
    let res;
    if(interact){
      res = await msalApp.loginRedirect({scopes:SCOPES});
    } else {
      const accs = msalApp.getAllAccounts();
      if(!accs.length){ showSignInBtn(); return; }
      res = await msalApp.acquireTokenSilent({scopes:SCOPES, account:accs[0]});
    }
    S.token=res.accessToken; S.odOk=true;
    setOD(true,'OK'); hideSignInBtn();
    await loadAll();
  }catch(e){setOD(false,'Sign in needed'); showSignInBtn();}
}
document.getElementById('msal-btn').onclick=()=>getToken(true);
function setOD(ok,lbl){
  document.getElementById('od-dot').className='od-dot '+(ok?'ok':'err');
  document.getElementById('od-lbl').textContent=lbl;
}

async function odGet(path){
  const r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${FOLDER}/${path}:/content`,
    {headers:{Authorization:`Bearer ${S.token}`}});
  if(!r.ok)throw new Error(r.status);
  return r.text();
}
async function odPut(path,txt){
  const r=await fetch(`https://graph.microsoft.com/v1.0/me/drive/root:/${FOLDER}/${path}:/content`,
    {method:'PUT',headers:{Authorization:`Bearer ${S.token}`,'Content-Type':'text/plain'},body:txt});
  if(!r.ok)throw new Error(r.status);
}

async function loadAll(){
  if(!S.odOk){loadDemo();return;}
  try{
    S.users  = parseCSV(await odGet('users.csv').catch(()=>'username\n'));
    S.tasks  = parseCSV(await odGet('tasks.csv').catch(()=>TASK_HDRS.join(',')+'\n'));
    S.goals  = parseCSV(await odGet('goals.csv').catch(()=>GOAL_HDRS.join(',')+'\n'));
    for(const u of S.users){
      const n=u.username;
      S.uTasks[n] = parseCSV(await odGet(`tasks_${n}.csv`).catch(()=>TASK_HDRS.join(',')+'\n'));
      S.plans[n]  = parseCSV(await odGet(`weekplan_${n}.csv`).catch(()=>PLAN_HDRS.join(',')+'\n'));
    }
    renderAll();
  }catch(e){toast('Load error: '+e.message)}
}

async function saveAll(){

  const btn=document.getElementById('btn-save');
  btn.textContent='Saving…';
  try{
    await odPut('users.csv',toCSV(S.users,USER_HDRS));
    await odPut('tasks.csv',toCSV(S.tasks,TASK_HDRS));
    await odPut('goals.csv',toCSV(S.goals,GOAL_HDRS));

function visibleTasks(){
  const gf=document.getElementById('goal-filter').value;
  let fam=(S.tasks||[]).filter(t=>t.valid==='yes');
  let usr=S.user?(S.uTasks[S.user]||[]).filter(t=>t.valid==='yes'):[];
  if(gf&&S.user){
    const ids=S.goals.filter(g=>g.username===S.user&&g.goal===gf).map(g=>g.task_id);
    fam=fam.filter(t=>ids.includes(t.id));
    usr=usr.filter(t=>ids.includes(t.id));
  }
  return{fam,usr};
}

function catTree(arr){
  const t={};
  arr.forEach(x=>{const c=x.category||'Other',s=x.subcategory||'General';if(!t[c])t[c]={};if(!t[c][s])t[c][s]=[];t[c][s].push(x)});
  return t;
}

function sortTasks(arr){
  const po={H:0,M:1,L:2};
  return arr.slice().sort((a,b)=>{
    const da=a.deadline?new Date(a.deadline):new Date('9999');
    const db=b.deadline?new Date(b.deadline):new Date('9999');
    return da-db||(po[a.priority]??2)-(po[b.priority]??2);
  });
}

function renderTasks(){
  const el=document.getElementById('tasks-list');
  el.innerHTML='';
  if(!S.user){el.innerHTML='<div class="no-user">Select a user to view tasks</div>';return;}
  const{fam,usr}=visibleTasks();
  const ft=catTree(fam), ut=catTree(usr);
  const cats=[...new Set([...Object.keys(ft),...Object.keys(ut)])].sort();

  cats.forEach(cat=>{
    const catDiv=document.createElement('div');catDiv.className='cat-block';
    const ch=document.createElement('div');ch.className='cat-hdr';
    ch.innerHTML=`<span class="arr">▼</span>${cat}`;
    catDiv.appendChild(ch);
    const cb=document.createElement('div');

    const subs=[...new Set([...Object.keys(ft[cat]||{}),...Object.keys(ut[cat]||{})])].sort();
    subs.forEach(sub=>{
      const sd=document.createElement('div');sd.className='subcat-block';
      const sh=document.createElement('div');sh.className='sub-hdr';
      sh.innerHTML=`<span class="arr">▼</span>${sub}`;sd.appendChild(sh);

      const cols=document.createElement('div');cols.className='task-cols';
      //const fl=document.createElement('div');fl.className='col-lbl fam';fl.textContent='Family';
      //const ul=document.createElement('div');ul.className='col-lbl usr';ul.textContent=S.user;
      //cols.appendChild(fl);cols.appendChild(ul);
      const fc=document.createElement('div');fc.className='tcol';
      const uc=document.createElement('div');uc.className='tcol';
      sortTasks((ft[cat]||{})[sub]||[]).forEach(t=>fc.appendChild(makeCard(t,'fam')));
      sortTasks((ut[cat]||{})[sub]||[]).forEach(t=>uc.appendChild(makeCard(t,'usr')));
      cols.appendChild(fc);cols.appendChild(uc);
      sd.appendChild(cols);cb.appendChild(sd);

      sh.onclick=()=>{sh.classList.toggle('collapsed');cols.style.display=sh.classList.contains('collapsed')?'none':''};
    });

    catDiv.appendChild(cb);el.appendChild(catDiv);
    ch.onclick=()=>{ch.classList.toggle('collapsed');cb.style.display=ch.classList.contains('collapsed')?'none':''};
  });
}

function makeCard(t,type){
  const c=document.createElement('div');
  c.className=`tcard ${type}`;c.draggable=true;
  c.dataset.id=t.id;c.dataset.type=type;
  const pr=t.priority||'L';
  const dur=t.duration?` (${t.duration}m)`:'';
  const dl=t.deadline?`<span class="tdl">⚑ ${t.deadline}</span>`:'';
  const fr=t.frequency&&t.frequency!=='once'?`<span class="tfreq">↻ ${t.frequency}</span>`:'';
  const lc=t.last_completed?`<span class="tlc" title="Last completed">✓ ${t.last_completed}</span>`:'';
  c.innerHTML=`
    <div class="tcard-top">
      <span class="prio-badge pP-${pr}">${pr}</span>
      <span class="tname">${t.task}</span><span class="tdur">${dur}</span>
    </div>
    <div class="tmeta">${dl}${fr}${lc}</div>`;
  c.addEventListener('dragstart',e=>{
    e.dataTransfer.setData('text/plain',JSON.stringify({id:t.id,type,dur:parseInt(t.duration)||0,name:t.task}));
    c.classList.add('dragging');
  });
  c.addEventListener('dragend',()=>c.classList.remove('dragging'));
  setupTouchSrc(c,{id:t.id,type,dur:parseInt(t.duration)||0,name:t.task,fromWeek:false,fromTray:false});
  c.addEventListener('dblclick',()=>{
    const taskType2 = (S.uTasks[S.user]||[]).find(x=>x.id===t.id) ? 'user' : 'family';
    showTaskModal(t, taskType2);
  });
  return c;
}

// Height of each hourly row in px (CSS var kept in sync)
const HR_H = 80;
document.documentElement.style.setProperty('--hr-h', HR_H+'px');

function dayDates(){
  const m=monday(dispWeek,dispYear);
  return Array.from({length:7},(_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return d});
}

function renderWeek(){
  const ph=S.phone;
  const days=dayDates();

  /* day headers */
  const dhr=document.getElementById('day-hdrs-row');
  dhr.innerHTML='<div class="t-gutter"></div>';
  const vi=ph?[S.dayOff]:[0,1,2,3,4,5,6];
  vi.forEach(i=>{
    const d=days[i];
    const el=document.createElement('div');
    el.className='dhdr'+(isToday(d)?' today':'');
    el.textContent=d.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short'});
    dhr.appendChild(el);
  });

  const pd=days[S.dayOff];
  document.getElementById('day-lbl').textContent=
    pd.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'short'});

  // Time labels are rebuilt after renderPlanEntries so heights match hour rows
  document.getElementById('t-labels').innerHTML='';

  const dcw=document.getElementById('dcols-wrap');dcw.innerHTML='';
  document.querySelectorAll('.unsched-col').forEach(e=>e.remove());
  const urow=document.getElementById('unsched-row');
  const nowH=NOW.getHours();

  vi.forEach(di=>{
    const d=days[di];
    const ds=dateStr(d);

    const uc=document.createElement('div');
    uc.className='unsched-col';uc.dataset.date=ds;uc.dataset.di=di;
    setupDropUnsched(uc,ds);urow.appendChild(uc);

    const col=document.createElement('div');
    col.className='dcol'+(isToday(d)?' today-col':'');
    col.dataset.date=ds;col.dataset.di=di;

    for(let h=0;h<24;h++){
      const row=document.createElement('div');
      row.className='hour-row'+(isToday(d)&&h===nowH?' now-hour':'');
      row.dataset.hour=h;
      row.dataset.date=ds;
      setupDropHour(row, ds, h);
      col.appendChild(row);
    }
    dcw.appendChild(col);
  });

  renderPlanEntries(vi,days);
  renderUnschedChips(vi,days);
  requestAnimationFrame(()=>syncTimeLabels());
}

function planFor(){ return S.user?(S.plans[S.user]||[]):[] }

function syncTimeLabels(){
  const tl=document.getElementById('t-labels');
  tl.innerHTML='';
  const firstCol=document.querySelectorAll('.dcol')[0];
  if(!firstCol)return;
  const rows=firstCol.querySelectorAll('.hour-row');
  rows.forEach((row,h)=>{
    const el=document.createElement('div');
    el.className='tlabel';
    el.textContent=`${p2(h)}:00`;
    el.style.height=row.offsetHeight+'px';
    el.style.minHeight=row.offsetHeight+'px';
    tl.appendChild(el);
  });
}
  
function renderPlanEntries(vi,days){
  document.querySelectorAll('.hour-row .wblock').forEach(e=>e.remove());
  document.querySelectorAll('.hr-more').forEach(e=>e.remove());
  document.querySelectorAll('.hr-tooltip').forEach(e=>e.remove());
  const plan=planFor();
  const isDesktop=!S.phone;
  const prioColors={H:'var(--red)',M:'var(--yellow)',L:'var(--green)'};

  vi.forEach((di,ci)=>{
    const ds=dateStr(days[di]);
    const col=document.querySelectorAll('.dcol')[ci];if(!col)return;

    // Group tasks by start hour
    const byHour={};
    plan.filter(p=>p.date===ds&&p.start_time!=='00:00').forEach(p=>{
      const h=Math.floor(t2m(p.start_time)/60);
      if(!byHour[h])byHour[h]=[];
      byHour[h].push(p);
    });

    Object.entries(byHour).forEach(([h,tasks])=>{
      const row=col.querySelector(`.hour-row[data-hour="${h}"]`);
      if(!row)return;

      // Always render all wblocks (CSS clips on desktop)
      tasks.forEach(p=>row.appendChild(makeWBlock(p)));

      if(isDesktop){
        // Build tooltip listing all tasks
        const tip=document.createElement('div');
        tip.className='hr-tooltip';
        tip.innerHTML=tasks.map(p=>{
          const task=findTask(p.task_id)||{};
          const pr=task.priority||'M';
          const planDur=t2m(p.end_time)-t2m(p.start_time);
          const dur=planDur>0?`${planDur}m`:(task.duration?`${task.duration}m`:'');
          const cat=task.category||'';
          const sub=task.subcategory||'';
          const catStr=cat?(sub?`(${cat} · ${sub})`:`(${cat})`):'';
          return `<div class="htt-row">
            <span class="htt-meta" style="color:${prioColors[pr]||prioColors.M}">${pr} · ${p.start_time}${dur?' · '+dur:''}</span>
            <span class="htt-name">${p.task}</span>
            ${catStr?`<span class="htt-cat">${catStr}</span>`:''}
          </div>`;
        }).join('');
        row.appendChild(tip);

        // After layout: detect clipping and add overflow badge; flip tooltip if needed
        requestAnimationFrame(()=>{
          const rowH=row.clientHeight;
          const blocks=row.querySelectorAll('.wblock');
          let clipped=false;
          blocks.forEach(b=>{
            if(b.offsetTop+b.offsetHeight>rowH) clipped=true;
          });
          if(clipped||tasks.length>1){
            const badge=document.createElement('div');
            badge.className='hr-more';
            badge.textContent=tasks.length>1?`+${tasks.length-1} ▾`:'▾';
            row.appendChild(badge);
          }
          // Flip tooltip left if too close to right edge
          const colRect=col.getBoundingClientRect();
          if(colRect.right+290>window.innerWidth) tip.classList.add('flip');
        });
      }
    });
  });
}
  
function renderUnschedChips(vi,days){
  document.querySelectorAll('.unsched-col .wblock').forEach(e=>e.remove());
  const plan=planFor();
  vi.forEach((di,ci)=>{
    const ds=dateStr(days[di]);
    const uc=document.querySelectorAll('.unsched-col')[ci];if(!uc)return;
    plan.filter(p=>p.date===ds&&p.start_time==='00:00').forEach(p=>{
      const tp=taskType(p.task_id);
      const chip=makeWBlock(p, true); // hideMeta=true hides start time, keeps priority+duration
      chip.draggable=true;
      chip.querySelector('.wx').addEventListener('click', e=>{e.stopPropagation();deletePlanEntry(p);});
      chip.addEventListener('dragstart', e=>{
        e.dataTransfer.setData('text/plain',JSON.stringify({fromTray:true,planEntry:p,id:p.task_id,type:tp,name:p.task,dur:0}));
        showTrash();
      });
      chip.addEventListener('dragend', ()=>hideTrash());
      chip.addEventListener('click', e=>{if(e.target.classList.contains('wx'))return;cycleStatus(p);});
      setupTouchSrc(chip,{fromTray:true,planEntry:p,id:p.task_id,type:tp,name:p.task,dur:0},()=>cycleStatus(p));
      uc.appendChild(chip);
    });
  });
}

function taskType(id){
  if((S.uTasks[S.user]||[]).find(t=>t.id===id))return 'usr';
  return 'fam';
}

function findTask(id){
  return S.tasks.find(t=>t.id===id)||Object.values(S.uTasks).flat().find(t=>t.id===id)||null;
}

function makeWBlock(p, hideMeta=false){
  const tp=taskType(p.task_id);
  const task=findTask(p.task_id)||{};
  const pr=task.priority||'M';
  // Prefer duration derived from the plan entry's own times (catches manually-entered durations)
  // Fall back to the task's stored duration if start===end (unscheduled or zero-duration)
  const planDurMins = t2m(p.end_time) - t2m(p.start_time);
  const dur = planDurMins > 0
    ? `${planDurMins}m`
    : (task.duration ? `${task.duration}m` : '');
  const cat=task.category||'';
  const sub=task.subcategory||'';
  const catStr=cat?(sub?`(${cat} · ${sub})`:`(${cat})`):'';
  const b=document.createElement('div');
  b.className=`wblock ${tp}`;

  let statusIcon='';
  if(p.completed==='in progress') statusIcon=`<span class="wblock-status" style="color:var(--yellow)">•••</span>`;
  else if(p.completed==='yes')    statusIcon=`<span class="wblock-status" style="color:var(--green)">✓</span>`;

  const prioColors={H:'var(--red)',M:'var(--yellow)',L:'var(--green)'};
  const prioCol=prioColors[pr]||prioColors.M;

  const metaRow=hideMeta?'':`<div class="wblock-row1">
    <span class="wblock-meta" style="color:${prioCol}">${pr}${dur?' · '+dur:''}</span>
    ${statusIcon}
  </div>`;
  const timeTag=hideMeta?'':p.start_time?`<span class="wblock-meta" style="color:${prioCol};margin-right:2px">${p.start_time}</span>`:'';

  b.innerHTML=`
    <div class="wblock-row1">
      ${hideMeta?`<span class="wblock-meta" style="color:${prioCol}">${pr}${dur?' · '+dur:''}</span>`:`<span class="wblock-meta" style="color:${prioCol}">${pr} ${p.start_time}${dur?' · '+dur:''}</span>`}
      ${statusIcon}
    </div>
    <div class="wblock-row2">
      <span class="wblock-name">${p.task}</span>
      ${catStr?`<span class="wblock-cat">${catStr}</span>`:''}
    </div>
    <span class="wx" title="Remove">✕</span>`;

  b.querySelector('.wx').addEventListener('click', e=>{e.stopPropagation();deletePlanEntry(p);});

  b.addEventListener('click', e=>{
    if(e.target.classList.contains('wx'))return;
    cycleStatus(p);
  });

  b.draggable=true;
  b.addEventListener('dragstart', e=>{
    const dur=t2m(p.end_time)-t2m(p.start_time);
    e.dataTransfer.setData('text/plain',JSON.stringify({fromWeek:true,planEntry:p,id:p.task_id,type:tp,name:p.task,dur}));
    b.classList.add('dragging-w');
    showTrash();
  });
  b.addEventListener('dragend', ()=>{b.classList.remove('dragging-w');hideTrash();});
  setupTouchSrc(b,{fromWeek:true,planEntry:p,id:p.task_id,type:tp,name:p.task,dur:t2m(p.end_time)-t2m(p.start_time)},()=>cycleStatus(p));
  return b;
}
  
function deletePlanEntry(p){
  if(!S.user)return;
  const arr=S.plans[S.user]||[];
  const i=arr.findIndex(x=>x.task_id===p.task_id&&x.date===p.date&&x.start_time===p.start_time);
  if(i>-1){arr.splice(i,1);S.dirty=true;renderWeek();}
}

function showTrash(){ document.getElementById('trash-zone').classList.add('visible'); }
function hideTrash(){ const tz=document.getElementById('trash-zone');tz.classList.remove('visible','over'); }

function cycleStatus(p){
  const ord=['no','in progress','yes'];
  p.completed=ord[(ord.indexOf(p.completed||'no')+1)%3];
  if(p.completed==='yes'){
    const t=findTask(p.task_id);
    if(t){
      const d=new Date(p.date+'T00:00:00');
      t.last_completed=`${p2(d.getDate())}/${p2(d.getMonth()+1)}/${String(d.getFullYear()).slice(2)}`;
      if(t.scheduled==='yes')t.valid='no';
    }
  }
  S.dirty=true;renderWeek();renderTasks();
}

function setupDropUnsched(el,ds){
  el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('dov')});
  el.addEventListener('dragleave',()=>el.classList.remove('dov'));
  el.addEventListener('drop',e=>{
    e.preventDefault();el.classList.remove('dov');
    let data;try{data=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}
    dropTray(data,ds);
  });
}

function setupDropHour(row, ds, hour){
  row.addEventListener('dragover',e=>{e.preventDefault();row.classList.add('dov')});
  row.addEventListener('dragleave',()=>row.classList.remove('dov'));
  row.addEventListener('drop',e=>{
    e.preventDefault();row.classList.remove('dov');
    let data;try{data=JSON.parse(e.dataTransfer.getData('text/plain'))}catch{return}
    dropToHour(data, ds, hour);
  });
}

function removePlan(data){
  if(!(data.fromWeek||data.fromTray)||!S.user)return;
  const p=data.planEntry;
  const arr=S.plans[S.user]||[];
  const i=arr.findIndex(x=>x.task_id===p.task_id&&x.date===p.date&&x.start_time===p.start_time);
  if(i>-1)arr.splice(i,1);
}

function dropTray(data,ds){
  if(!S.user){toast('Select a user first');return}
  const task=findTask(data.id)||{};
  const hasDur=data.dur>0||parseInt(task.duration)>0;
  if(!hasDur){
    // No duration known — prompt before placing in the unscheduled tray
    const ov=document.createElement('div');ov.className='movl';
    ov.innerHTML=`<div class="mdl" style="max-width:320px">
      <h3 style="margin-bottom:12px">Add to unscheduled</h3>
      <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text2)">${data.name}</div>
      <div class="fr"><label>Duration (min) — leave blank if unknown</label>
        <input id="tray-dur" type="number" min="0" placeholder="e.g. 30"></div>
      <div class="macts">
        <button class="btn-c">Cancel</button>
        <button class="btn-ok">Add</button>
      </div>
    </div>`;
    document.body.appendChild(ov);
    ov.querySelector('#tray-dur').focus();
    ov.querySelector('.btn-c').onclick=()=>ov.remove();
    ov.querySelector('.btn-ok').onclick=()=>{
      const dur=parseInt(ov.querySelector('#tray-dur').value)||0;
      removePlan(data);
      // Store duration in end_time offset from midnight so it's retrievable later
      // For unscheduled: start=end=00:00 when no duration, or end=00:00+dur
      pushPlan({week_num:String(dispWeek),year:String(dispYear),date:ds,task_id:data.id,task:data.name,
        start_time:'00:00',end_time:dur?m2t(dur):'00:00',completed:'no'});
      ov.remove();
    };
    ov.addEventListener('keydown',e=>{if(e.key==='Enter')ov.querySelector('.btn-ok').click();});
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
  } else {
    removePlan(data);
    const dur=data.dur||parseInt(task.duration)||0;
    pushPlan({week_num:String(dispWeek),year:String(dispYear),date:ds,task_id:data.id,task:data.name,
      start_time:'00:00',end_time:dur?m2t(dur):'00:00',completed:'no'});
  }
}

function dropToHour(data, ds, hour){
  if(!S.user){toast('Select a user first');return}
  const task=findTask(data.id)||{};
  const defaultDur=data.dur||parseInt(task.duration)||0;
  const defaultTime=`${p2(hour)}:00`;

  const ov=document.createElement('div');ov.className='movl';
  ov.innerHTML=`<div class="mdl" style="max-width:320px">
    <h3 style="margin-bottom:12px">Place in schedule</h3>
    <div style="font-size:13px;font-weight:600;margin-bottom:12px;color:var(--text2)">${data.name}</div>
    <div class="fr"><label>Start time</label>
      <input id="drop-time" type="time" step="300" value="${defaultTime}"></div>
    <div class="fr"><label>Duration (min)</label>
      <input id="drop-dur" type="number" min="0" placeholder="e.g. 30" value="${defaultDur||''}"></div>
    <div class="macts">
      <button class="btn-c">Cancel</button>
      <button class="btn-ok">Add</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  ov.querySelector('#drop-time').focus();
  ov.querySelector('.btn-c').onclick=()=>ov.remove();
  ov.querySelector('.btn-ok').onclick=()=>{
    const st=ov.querySelector('#drop-time').value||defaultTime;
    const dur=parseInt(ov.querySelector('#drop-dur').value)||0;
    const sm=t2m(st);
    removePlan(data);
    pushPlan({week_num:String(dispWeek),year:String(dispYear),date:ds,task_id:data.id,task:data.name,
      start_time:m2t(sm), end_time:dur?m2t(sm+dur):m2t(sm), completed:'no'});
    ov.remove();
  };
  ov.addEventListener('keydown',e=>{if(e.key==='Enter')ov.querySelector('.btn-ok').click();});
  ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
}

function pushPlan(entry){
  if(!S.plans[S.user])S.plans[S.user]=[];
  S.plans[S.user].push(entry);
  S.dirty=true;renderWeek();
}

let td=null,tc=null;

function setupTouchSrc(el,data){
  el.addEventListener('touchstart',e=>{
    td=data;tc=el.cloneNode(true);
    tc.style.cssText=`position:fixed;z-index:9999;opacity:.7;pointer-events:none;width:${el.offsetWidth}px;transform:scale(.93)`;
    document.body.appendChild(tc);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!tc)return;
    const t=e.touches[0];
    tc.style.left=(t.clientX-tc.offsetWidth/2)+'px';
    tc.style.top=(t.clientY-20)+'px';
  },{passive:true});
  el.addEventListener('touchend',e=>{
    if(!tc){return}tc.remove();tc=null;
    const t=e.changedTouches[0];
    handleTouchDrop(t.clientX,t.clientY,td);td=null;
  });
}

function handleTouchDrop(cx,cy,data){
  if(!data)return;
  const el=document.elementFromPoint(cx,cy);if(!el)return;
  const uc=el.closest('.unsched-col');
  const hr=el.closest('.hour-row');
  if(uc) dropTray(data,uc.dataset.date);
  else if(hr) dropToHour(data, hr.dataset.date, parseInt(hr.dataset.hour));
}

function printDay(){
  if(!S.user){toast('Select a user first');return;}
  const dateVal = document.getElementById('p-date').value;
  if(!dateVal){toast('Pick a date first');return;}
 
  const plan = S.plans[S.user]||[];
  const entries = plan.filter(p=>p.date===dateVal);
 
  const timed = entries
    .filter(p=>p.start_time!=='00:00')
    .sort((a,b)=>t2m(a.start_time)-t2m(b.start_time));
  const untimed = entries
    .filter(p=>p.start_time==='00:00');
 
  const prioStyle={
    H:{bg:'#ffe4e4',border:'#f5b8b8',label:'High'},
    M:{bg:'#fff8e1',border:'#f5dfa0',label:'Medium'},
    L:{bg:'#e8f5e9',border:'#b2dfb4',label:'Low'},
  };
 
  const d = new Date(dateVal+'T00:00:00');
  const dateLabel = d.toLocaleDateString('en-GB',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
 
  const START_H = 6;
  const END_H   = 24;
  const midH    = 15;
  const useSplit = timed.length > 10;
 
  // Group timed tasks by start hour
  function tasksByHour(){
    const byH={};
    timed.forEach(p=>{
      const h=Math.floor(t2m(p.start_time)/60);
      if(!byH[h])byH[h]=[];
      byH[h].push(p);
    });
    return byH;
  }
 
  // Build one schedule column fromH..toH as hourly rows
  function buildScheduleCol(fromH, toH){
    const byH=tasksByHour();
    let out='';
    for(let h=fromH;h<toH;h++){
      const tasks=byH[h]||[];
      const hStr=String(h).padStart(2,'0');
      const hasTask=tasks.length>0;
      const taskRows=tasks.map(p=>{
          const task=findTask(p.task_id)||{};
          const pr=task.priority||'M';
          const ps=prioStyle[pr]||prioStyle.M;
          const dur=task.duration?` · ${task.duration}m`:'';
          const cat=task.category||'';
          const sub=task.subcategory||'';
          const catStr=cat?(sub?`(${cat} · ${sub})`:`(${cat})`):'';
          const prBadge=`<span style="background:${ps.bg};border:1px solid ${ps.border};border-radius:2px;font-size:8px;font-weight:700;padding:0 3px;color:#555;margin-right:4px;white-space:nowrap;display:inline-block">${ps.label[0]}</span>`;
          return `<div style="padding:2px 0;border-bottom:1px dotted #eee;line-height:1.5">
            <div style="font-size:9px;color:#777;margin-bottom:1px">${prBadge}${p.start_time}${dur}</div>
            <div style="font-size:10px;font-weight:600;color:#222;word-break:break-word">${p.task}${catStr?`<span style="font-size:8px;color:#aaa;font-weight:400;margin-left:4px">${catStr}</span>`:''}</div>
          </div>`;
        }).join('');
      out+=`<div style="display:flex;border-bottom:1px solid ${hasTask?'#d0d0d0':'#efefef'};min-height:22px;background:${hasTask?'#fafafa':'#fff'}">
        <div style="width:32px;flex-shrink:0;font-size:9px;padding:3px 4px 0 0;text-align:right;border-right:1px solid #e0e0e0;font-weight:${hasTask?700:400};color:${hasTask?'#333':'#ccc'}">${hStr}</div>
        <div style="flex:1;padding:2px 5px;min-height:${hasTask?'auto':'22px'}">${taskRows}</div>
      </div>`;
    }
    return out;
  }
 
  function buildTodoList(){
    if(!untimed.length) return '<div style="color:#aaa;font-size:11px">None</div>';
    return untimed.map(p=>{
      const task=findTask(p.task_id)||{};
      const pr=task.priority||'M';
      const ps=prioStyle[pr]||prioStyle.M;
      const dur=task.duration?` <span style="color:#999;font-size:9px">(${task.duration}m)</span>`:'';
      const prBadge=`<span style="background:${ps.bg};border:1px solid ${ps.border};border-radius:2px;font-size:8px;font-weight:700;padding:0 3px;color:#555;margin-right:4px;display:inline-block">${ps.label[0]}</span>`;
      const cat=task.category||'';
      const sub=task.subcategory||'';
      const catStr=cat?(sub?`(${cat} · ${sub})`:`(${cat})`):'';
      return `<div style="display:flex;align-items:flex-start;gap:6px;margin-bottom:7px;padding-bottom:7px;border-bottom:1px solid #f0f0f0">
        <div style="width:13px;height:13px;border:1.5px solid #ccc;border-radius:50%;flex-shrink:0;margin-top:4px"></div>
        <div style="line-height:1.4">
          <div style="font-size:9px;color:#888;margin-bottom:1px">${prBadge}${dur}</div>
          <div style="font-size:11px;font-weight:600;color:#222;word-break:break-word">${p.task}${catStr?`<span style="font-size:9px;color:#aaa;font-weight:400;margin-left:4px">${catStr}</span>`:''}</div>
        </div>
      </div>`;
    }).join('');
  }
 
  const html=`<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Day Plan — ${dateLabel}</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;background:#fff;color:#222;padding:20px 24px}
  @media print{body{padding:0}@page{size:A4 portrait;margin:10mm 10mm 10mm 10mm}}
  .page-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #222;padding-bottom:8px;margin-bottom:10px}
  .page-title{font-size:18px;font-weight:800;letter-spacing:-.5px}
  .page-user{font-size:11px;color:#666;margin-top:2px}
  .page-date{font-size:11px;font-weight:600;text-align:right;color:#444}
  .legend{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .legend-item{display:flex;align-items:center;gap:3px;font-size:9px;color:#666}
  .legend-swatch{width:9px;height:9px;border-radius:2px;border:1px solid;flex-shrink:0}
  .col-title{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:#999;margin-bottom:5px;border-bottom:1px solid #eee;padding-bottom:3px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .no-print-btn{position:fixed;bottom:16px;right:16px;background:#222;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;z-index:999}
  @media print{.no-print-btn{display:none}}
</style>
</head>
<body>
<div class="page-header">
  <div><div class="page-title">Daily Schedule</div><div class="page-user">${S.user}</div></div>
  <div class="page-date">${dateLabel}</div>
</div>
${useSplit ? `
<div class="two-col" style="margin-bottom:10px">
  <div><div class="col-title">Schedule 06:00–15:00</div>${buildScheduleCol(START_H,midH)}</div>
  <div><div class="col-title">Schedule 15:00–24:00</div>${buildScheduleCol(midH,END_H)}</div>
</div>
<div><div class="col-title">To Do — no fixed time</div>
<div class="two-col">${buildTodoList()}</div></div>
` : `
<div class="two-col">
  <div><div class="col-title">Schedule 06:00–24:00</div>${buildScheduleCol(START_H,END_H)}</div>
  <div><div class="col-title">To Do — no fixed time</div>${buildTodoList()}</div>
</div>
`}
<button class="no-print-btn" onclick="window.print()">🖨 Print / Save PDF</button>
<script>setTimeout(()=>window.print(),400);<\/script>
</body>
</html>`;
 
  const w = window.open('','_blank');
  if(!w){toast('Allow popups to print');return;}
  w.document.write(html);
  w.document.close();
}

renderAll();
initMSAL();
</script>
</body>
